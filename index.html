DATA[3].lesson={en:"Assess edema at every prenatal visit after 20 weeks. Press firmly with your thumb for about 15 seconds, then judge the extent, the pit depth and the rebound time. 1+: minimal, up to 2 mm, rebounds immediately. 2+: 3 to 4 mm, rebounds in under 15 seconds. 3+: 5 to 6 mm in the lower limbs, face and hands, rebounds within 60 seconds. 4+: 7 to 8 mm, generalized and massive, rebounds in 2 to 3 minutes. Sudden swelling of the face or hands, or one leg larger than the other, are alarm signs.",
ar:"بنقيّم الـ edema في كل زيارة بعد الأسبوع 20. بنضغط بالإبهام حوالي 15 ثانية، وبعدين نشوف مدى الانتشار وعمق الـ pit وسرعة رجوعه. 1+: بسيط لحد 2 مم ويرجع فورًا. 2+: من 3 لـ 4 مم ويرجع في أقل من 15 ثانية. 3+: من 5 لـ 6 مم في الرجلين والوش واليدين ويرجع في حدود 60 ثانية. 4+: من 7 لـ 8 مم، تورّم عام وكبير، ويرجع في 2 لـ 3 دقايق. لو الوش أو اليدين ورموا فجأة، أو رجل أكبر من التانية، دي alarm signs."};

lesson:{en:"Abdominal examination is a visual, tactile and audible examination of the abdomen, done from 24 weeks, mainly in the last trimester. Aims: confirm pregnancy, estimate gestational age, determine lie, position, presenting part, attitude and engagement, assess fetal well-being, and detect deviations. Contraindications: placental abruption, preterm labor, placenta previa and severe abdominal pain. Position the woman semi-supine with the head raised 15° after she empties her bladder; stand on her right. Then inspect, palpate (fundal height, four grips) and auscultate (FHR 110 to 160 b/m).",
ar:"الفحص البطني هو فحص بالنظر واللمس والسمع لبطن الحامل، وبنعمله من الأسبوع 24 وغالبًا في الـ last trimester. أهدافه: تأكيد الحمل، وتقدير عمر الحمل، وتحديد الـ lie والـ position والـ presenting part والـ attitude والـ engagement، وتقييم سلامة الجنين، واكتشاف أي انحراف. موانع الفحص: placental abruption وpreterm labor وplacenta previa وألم شديد في البطن. الست تفضّي المثانة الأول وتنام semi-supine والراس مرفوعة 15 درجة، وإحنا بنقف على يمينها. بعدين inspection وبعدها palpation (fundal height والأربع grips) وبعدها auscultation للـ FHR من 110 لـ 160 b/m."},
v:[["Preparation","Empty the bladder, position semi-supine with the head raised 15 degrees, expose the abdomen from xiphisternum to symphysis pubis, and stand on her right side.","الست تفضّي المثانة وتنام semi-supine والراس مرفوعة 15 درجة، ونكشف البطن من xiphisternum لحد symphysis pubis، ونقف على يمينها."],
["Inspection","Look for linea nigra, striae gravidarum, scars, fetal movements, and the shape of the abdomen.","بنبص على الـ linea nigra والـ striae gravidarum وأي scars وحركة الجنين وشكل البطن."],
["Fundal height","The fundus is at the symphysis pubis at 12 weeks, the umbilicus at 24 weeks, and the xiphisternum at 36 weeks. With a tape, centimeters roughly equal weeks.","الـ fundus عند الـ symphysis pubis في 12 أسبوع، وعند السرّة في 24 أسبوع، وعند الـ xiphisternum في 36 أسبوع. وبالشريط، السنتي تقريبًا بيساوي أسبوع."],
["Fundal and lateral grips","Facing her head: the buttocks feel soft and irregular, the head hard, round and mobile. Then the back feels broad and smooth, while the limbs are small and irregular.","واحنا قدام راسها: الـ buttocks ناعمة وغير منتظمة، والراس صلبة ومدوّرة ومتحركة. وبعدين الضهر عريض وأملس، والـ limbs صغيرة وغير منتظمة."],
["Pelvic grips","After 36 weeks, Pawlik's grip: a mobile presenting part is not engaged, a fixed one is engaged. Then face her feet for the second pelvic grip to feel the cephalic prominence.","بعد 36 أسبوع نعمل Pawlik's grip: لو الـ presenting part بتتحرك يبقى not engaged، ولو ثابتة يبقى engaged. وبعدين نواجه رجليها ونعمل second pelvic grip عشان نحس بالـ cephalic prominence."],
["Auscultation","Place the Pinard on the anterior shoulder and listen for a full minute. Normal FHR is 110 to 160 beats per minute. Check the maternal pulse to be sure.","نحط الـ Pinard على الـ anterior shoulder ونسمع دقيقة كاملة. الـ FHR الطبيعي من 110 لـ 160 b/m. ونحسس على نبض الأم عشان نتأكد إننا مش سامعين نبضها هي."]],

["Preparation","Prepare the tape measure, Pinard fetoscope or Doppler, the woman's record, gloves, a watch with a second hand and soap. Ask her to empty her bladder, position her semi-supine with the head raised 15°, expose only from xiphisternum to symphysis pubis, wash your hands and stand on her right.","يالا يا دكاترة، الأول نجهّز الأدوات: tape measure وPinard fetoscope أو Doppler وساعة بعقرب ثواني. وبعدين نقول للست تفضّي المثانة، ونخليها semi-supine والراس مرفوعة 15 درجة، ونكشف البطن بس من xiphisternum لحد symphysis pubis. نغسل إيدينا ونقف على يمينها. ركّزوا: الخصوصية أهم حاجة.",["tape","pinard","doppler"],"Empty bladder prevents a wrong fundal height; 15° head-up relaxes the abdomen and avoids supine hypotension; standing on the right makes the exam easier.","المثانة الفاضية بتمنع غلط في قياس الـ fundal height، ورفع الراس 15 درجة بيرخّي عضلات البطن ويمنع supine hypotension، والوقوف على اليمين بيسهّل الفحص."],
["Inspection","Inspect for linea nigra (dark line from umbilicus to symphysis pubis) and striae gravidarum (pink stretch marks). Look for scars such as a cesarean section scar, note fetal movements, and check the shape: longer than broad suggests a longitudinal lie.","أول حاجة بنبص كويس. شايفين الخط الغامق ده؟ ده linea nigra من السرّة لحد الـ symphysis pubis. والخطوط الوردي دي striae gravidarum. وبندوّر على أي scar زي عملية cesarean section، ونشوف حركة الجنين. لو الرحم أطول من عرضه يبقى غالبًا longitudinal lie.",["linea","striae"],"Abdominal shape is the first clue to fetal lie; size can be affected by obesity, multiple pregnancy or polyhydramnios.","شكل البطن أول دليل على وضع الجنين، وحجمها ممكن يتأثر بالسمنة أو الحمل المتعدد أو polyhydramnios."],
["Fundal height","Place the ulnar border of your left hand just below the xiphisternum and move down. The fundus is at the symphysis pubis at 12 weeks, the umbilicus at 24 weeks and the xiphisternum at 36 weeks. With a tape from fundus to symphysis pubis, centimeters roughly equal weeks.","بنحط الحد الزندي لإيدنا الشمال تحت الـ xiphisternum ونوطّي لتحت. اتفقنا: في 12 أسبوع الـ fundus عند الـ symphysis pubis، وفي 24 عند السرّة، وفي 36 عند الـ xiphisternum. والطريقة الأدق الـ tape measure: من الـ fundus للـ symphysis pubis، والسنتي تقريبًا بيساوي أسبوع.",["fund","land"],"Fundal height larger than dates may mean polyhydramnios or twins; smaller may mean IUGR or oligohydramnios.","لو الـ fundal height أكبر من العمر ممكن polyhydramnios أو توأم، ولو أصغر ممكن IUGR أو oligohydramnios."],
["Fundal and lateral grips","Facing her head, place both hands on the fundus: the buttocks feel soft and irregular, the head hard and round. Then the lateral grip: steady one side and palpate the other; the back is broad and smooth, the limbs small and irregular.","واحنا قدام راسها بنحط الإيدين على الـ fundus. الـ buttocks بتحسّوها ناعمة وغير منتظمة، والراس صلبة ومدوّرة. وبعدين lateral grip: إيد بتثبّت وإيد بتحسس الناحية التانية. الضهر عريض وأملس، والـ limbs صغيرة وغير منتظمة.",["g1","g2"],"The fundal grip tells lie and presentation; the lateral grip tells position.","الـ fundal grip بيقول الـ lie والـ presentation، والـ lateral grip بيقول الـ position."],
["Pelvic grips","After 36 weeks use Pawlik's grip: grasp the lower uterus between thumb and fingers. A mobile presenting part is not engaged; a fixed one is engaged. Then face her feet for the second pelvic grip to feel the cephalic prominence, descent and attitude.","بعد 36 أسبوع بنعمل Pawlik's grip: نمسك الجزء التحتاني من الرحم بين الإبهام والصوابع. لو الـ presenting part بتتحرك يبقى not engaged، ولو ثابتة يبقى engaged. وبعدين نلف ونواجه رجليها ونعمل second pelvic grip عشان نحس بالـ cephalic prominence ونعرف الـ descent والـ attitude.",["g3","g4"],"These grips confirm whether the head has entered the pelvis, which matters for planning labor.","الـ grips دي بتأكد الراس دخلت الحوض ولا لأ، وده مهم لتخطيط الولادة."],
["Auscultation","Place the Pinard fetoscope on the anterior shoulder, press your ear firmly, remove your hands and listen for a full minute. Normal FHR is 110 to 160 b/m. Feel the mother's pulse to be sure you are not hearing her heart. Then drape her, wash hands, share findings and record.","بنحط الـ Pinard على الـ anterior shoulder ونلزّق ودننا كويس، ونشيل إيدينا ونسمع دقيقة كاملة. الـ FHR الطبيعي من 110 لـ 160 b/m. وبنحسس على نبض الأم عشان نتأكد إننا مش سامعين قلبها هي. وفي الآخر نغطّيها ونغسل إيدينا ونقولها النتيجة ونسجّل.",["ausc","pinard"],"Checking the maternal pulse prevents mistaking it for the fetal heart rate.","نبض الأم بيمنعنا نغلط ونحسب نبضها على إنه نبض الجنين."]];

DATA[4]={lesson:{en:"Deep tendon reflex (DTR) is an involuntary contraction of a muscle in response to stretch. The test determines the integrity of the spinal cord and peripheral nervous system and can detect a neuromuscular disease. In obstetrics it is assessed in women treated with MgSO4 (severe pre-eclampsia and eclampsia) to determine the need for therapy, evaluate its efficacy and prevent toxicity. The patellar and biceps reflexes are tapped with a reflex hammer and rated: 0 absent, +1 hypoactive, +2 normal (extension or kicking out of the leg), +3 hyperactive (brisk), +4 clonus. Compare both sides and record.",
ar:"الـ deep tendon reflex (DTR) هو انقباض لا إرادي في العضلة استجابةً للشد (stretch). الفحص بيحدد سلامة الحبل الشوكي والجهاز العصبي الطرفي وممكن يكشف مرض عصبي عضلي. في التوليد بنفحصه للسيدات اللي بياخدوا MgSO4 (severe pre-eclampsia وeclampsia) عشان نحدد الحاجة للعلاج ونقيّم فاعليته ونمنع التسمم. بنضرب الـ patellar والـ biceps بالـ reflex hammer وندرّج: 0 غايب، +1 hypoactive، +2 طبيعي (فرد الرجل أو ركلها لبرّه)، +3 hyperactive (نشيط)، +4 clonus. قارن الجنبين وسجّل."},
must:[["DTR = **involuntary contraction of a muscle in response to stretch**.","Tests the **integrity of the spinal cord and peripheral nervous system**; can detect a neuromuscular disease.","In obstetrics: women on **MgSO4** (severe pre-eclampsia, eclampsia) to **determine need, evaluate efficacy, prevent toxicity**.","**Patellar**: sitting with legs **hanging freely** over the table end, or **lying on her side with the knee slightly flexed**; locate the ligamentous patella tendon at the **base of the patella** and tap it directly.","**Biceps**: flex the elbow, place your **thumb across the tendon in the antecubital space** and tap your thumb.","Scale: **0** absent · **+1** hypoactive · **+2** normal (extension / kicking out of the leg) · **+3** hyperactive (brisk) · **+4** clonus.","**Repeat** if you cannot elicit the response, compare **both sides**, then record and compare with the previous finding."],
["الـ DTR = **انقباض لا إرادي في العضلة استجابةً للشد**.","بيختبر **سلامة الحبل الشوكي والجهاز العصبي الطرفي** وممكن يكشف مرض عصبي عضلي.","في التوليد: للسيدات على **MgSO4** (severe pre-eclampsia وeclampsia) عشان **نحدد الحاجة ونقيّم الفاعلية ونمنع التسمم**.","**Patellar**: قاعدة والرجلين **متدلية بحرية** على طرف السرير، أو **نايمة على جنبها والركبة مثنية شوية**؛ لاقي وتر الـ patella عند **قاعدة الرضفة** واضربه مباشرة.","**Biceps**: اثني الكوع وحط **إبهامك على الوتر في الـ antecubital space** واضرب إبهامك.","التدريج: **0** غايب · **+1** hypoactive · **+2** طبيعي (فرد الرجل أو ركلها) · **+3** hyperactive نشيط · **+4** clonus.","**كرّر** لو مش عارف تطلّع الاستجابة، وقارن **الجنبين**، وسجّل وقارن بالنتيجة اللي فاتت."]],
facts:[{en:"Definition and indication",ar:"التعريف والاستخدام",l:["DTR is an **involuntary contraction of a muscle in response to stretch**","Used to determine the **integrity of the spinal cord and peripheral nervous system**","Indicated in cases treated with **MgSO4** (severe pre-eclampsia and eclampsia)","Aims: **determine the need for MgSO4**, **evaluate efficacy**, **prevent toxicity**"]},{en:"Link to MgSO4 toxicity",ar:"الربط بتسمم MgSO4",c:"red",l:["Signs of toxicity: **respiratory rate under 12**, urine output under 100 mL in 4 h (30 mL/h), **absent patellar reflex**, further seizures","Give MgSO4 only when the DTR is **normal** before starting","If toxic: **stop the medication immediately**, give plain IV fluids, report the doctor"]}],
tbl:[{t:{en:"DTR rating scale",ar:"مقياس تدريج الـ DTR"},h:[["Grade","Reflex response"],["الدرجة","استجابة المنعكس"]],r:[["**0**","Reflex absent"],["**+1**","Reflex hypoactive"],["**+2**","Normal reflex (extension or kicking out of the leg)"],["**+3**","Hyperactive (brisk): the foot is sharply dorsiflexed and held for a moment, then released"],["**+4**","Clonus"]]}],
v:[["Prepare","Wash your hands, prepare the reflex hammer and explain the procedure to the mother.","اغسل إيدك وجهّز الـ reflex hammer واشرح للأم هنعمل إيه.",[],"Hand washing prevents cross infection; preparing equipment saves time and effort; explaining decreases anxiety and gains cooperation.","غسيل الإيد بيمنع العدوى، وتجهيز الأدوات بيوفّر وقت ومجهود، والشرح بيقلّل القلق وبيكسب تعاون الأم."],
["Patellar","She sits with legs hanging freely over the end of the table, or lies on her side with the knee slightly flexed. Locate the patella tendon at the base of the patella and tap it directly with the hammer.","خليها تقعد والرجلين متدلية بحرية على طرف السرير، أو تنام على جنبها والركبة مثنية شوية. لاقي وتر الـ patella عند قاعدة الرضفة واضربه مباشرة بالـ hammer.",[],"The expected +2 response is extension or kicking out of the leg.","الاستجابة الطبيعية +2 هي فرد الرجل أو ركلها لبرّه."],
["Biceps","Flex the woman's elbow, place your thumb across the tendon in the antecubital space and tap your thumb, which is pressing on the tendon.","اثني كوع السيدة وحط إبهامك على الوتر في الـ antecubital space واضرب إبهامك اللي ضاغط على الوتر.",[],"The tap lands on your thumb, which rests on the tendon.","الضربة بتقع على إبهامك اللي مسنود على الوتر."],
["Rate","Rate the response: 0 absent, +1 hypoactive, +2 normal, +3 hyperactive (brisk), +4 clonus.","درّج الاستجابة: 0 غايب، +1 hypoactive، +2 طبيعي، +3 hyperactive نشيط، +4 clonus.",[],"At +3 the foot is sharply dorsiflexed and held for a moment, then released.","في الـ +3 القدم بتتثني لفوق بقوة وتثبت لحظة وبعدين تتحرر."],
["Clonus","Explain, semi-flex the knee and support the leg under the knee. Sharply dorsiflex the foot with the other hand, keep slight pressure, then release and observe.","اشرح للسيدة، اثني الركبة شوية وسند الرجل بإيدك تحت الركبة. بالإيد التانية ادفع القدم لفوق بقوة وسيب ضغط خفيف، وبعدين سيب القدم وراقب.",[],"Count the beats of rhythmic contraction and relaxation after the sharp stretch.","عدّ الرعشات: انقباض وارتخاء إيقاعي بعد الشد السريع."],
["Repeat & compare","Repeat if you cannot elicit the response or to confirm it as absent or diminished. Assess each reflex symmetrically, comparing both sides.","كرّر لو ما عرفتش تطلّع الاستجابة أو عشان تأكد إنها غايبة أو ضعيفة. قيّم كل منعكس بالتماثل وقارن الجنبين.",[],"The reflex response for a tendon should be the same on the right and left sides.","استجابة الوتر لازم تكون واحدة في اليمين والشمال."],

must:[[`The lesson has **${T2N} terms** in 7 groups.`,"**Gravida** = number of pregnancies (with the current one); **para** = number of births after viability. Abortions count in G, not in P.","Twins born from one pregnancy count as **one** para.","**Lie** (long axis) · **presentation** (part at the inlet) · **attitude** (parts to each other) · **position** (denominator to the pelvis) · **engagement** (widest part through the inlet).","Denominator: vertex → **occiput**, breech → **sacrum**, face → **mentum**.","Duration: **abortion** under 20 wk · **preterm** under 37 wk · **term** 37–42 wk · **post-term** over 42 wk · **stillbirth** = no signs of life after 28 wk.","Labor: **effacement** = thinning (%), **dilation** = opening (0–10 cm). After birth: **puerperium** about 6 wk, **lochia** rubra → serosa → alba."],
[`الدرس فيه **${T2N} مصطلح** في 7 مجموعات.`,"**Gravida** = عدد الحمول (مع الحمل الحالي)، و**para** = عدد الولادات بعد الـ viability. الإجهاض بيتحسب في الـ G مش في الـ P.","التوأم من حمل واحد بيتحسب **para واحد**.","**Lie** (المحور) · **presentation** (الجزء عند المدخل) · **attitude** (الأجزاء بالنسبة لبعض) · **position** (الـ denominator بالنسبة للحوض) · **engagement** (أعرض جزء عدّى المدخل).","الـ denominator: الـ vertex → **occiput**، والـ breech → **sacrum**، والـ face → **mentum**.","المدة: **abortion** أقل من 20 أسبوع · **preterm** أقل من 37 · **term** من 37 لـ 42 · **post-term** أكتر من 42 · **stillbirth** = جنين من غير علامات حياة بعد 28 أسبوع.","الولادة: **effacement** = ترقّق (%)، و**dilation** = فتح (0–10 سم). بعد الولادة: **puerperium** حوالي 6 أسابيع، و**lochia** rubra ← serosa ← alba."]],

v:[
[T2G[0],"**Gravida** is the number of pregnancies including the current one. **Para** is the number of births after viability, alive or dead. A woman pregnant now with one earlier term baby and one abortion at 8 weeks is **G3 P1**.","أول مجموعة: الحمل والولادات. الـ gravida هو عدد الحمول كلها، حتى الحمل الحالي والإجهاض. والـ para هو عدد الولادات بعد الـ viability، سواء الجنين عايش أو ميت. يعني ست حامل دلوقتي وعندها ولادة كاملة وإجهاض في الأسبوع 8 تبقى G3 P1. والتوأم من حمل واحد بيتحسب para واحد.",[],"G and P sum up the obstetric history in two numbers and guide the risk assessment.","الـ G والـ P بيلخصوا التاريخ التوليدي في رقمين وبيساعدوا في تقييم الخطورة.",T2C[0]],
[T2G[1],"**Abortion** is the end of a pregnancy before 20 weeks. **Preterm** is before 37 weeks, **term** is 37 to 42 weeks and **post-term** is after 42. **Stillbirth** is a baby with no signs of life after 28 weeks.","المجموعة التانية عن نتيجة الحمل ومدته. الـ abortion إن الحمل ينتهي قبل 20 أسبوع. والـ preterm قبل 37 أسبوع، والـ term من 37 لـ 42، والـ post-term بعد 42. والـ stillbirth جنين من غير علامات حياة بعد 28 أسبوع. والـ viability قدرة الجنين يعيش برّه الرحم.",[],"The gestational age at birth decides the level of newborn care.","عمر الحمل وقت الولادة بيحدد مستوى رعاية المولود.",T2C[1]],
[T2G[2],"The **lie** is the fetal long axis compared with the mother's. The **presentation** is the part at the pelvic inlet. The **attitude** is how the fetal parts relate to each other. The **position** is where the denominator lies in the pelvis, and **engagement** means the widest part has passed the inlet.","دلوقتي علاقة الجنين بالحوض. الـ lie هو اتجاه جسم الجنين بالنسبة لجسم الأم. الـ presentation هو الجزء النازل عند مدخل الحوض. الـ attitude هو وضع أجزاء الجنين بالنسبة لبعض، يعني الانثناء. والـ denominator علامة ثابتة على الجزء ده، والـ position مكان العلامة دي في الحوض. والـ engagement يعني أعرض جزء عدّى مدخل الحوض.",[],"These six words describe the fetus in one line, from the abdominal examination to labor.","الكلمات دي بتوصف الجنين في سطر واحد، من الفحص البطني لحد الولادة.",T2C[2]],
[T2G[3],"Amniotic fluid surrounds the fetus. **Oligohydramnios** is too little fluid and **polyhydramnios** is too much. A newborn under 2,500 g has **low birth weight**, and about 4,000 g or more is **macrosomia**.","السوائل والوزن. الـ amniotic fluid هو السائل اللي حوالين الجنين. الـ oligohydramnios سائل قليل، والـ polyhydramnios سائل زيادة. المولود أقل من 2500 جرام يبقى low birth weight، ولو 4000 جرام أو أكتر يبقى macrosomia.",[],"Fluid volume and weight change the fundal height and the delivery plan.","كمية السائل والوزن بيغيّروا الـ fundal height وخطة الولادة.",T2C[3]],
[T2G[4],"Before labor the mother may feel **quickening**, the first fetal movements. **Lightening** is the head settling into the pelvis. **Braxton Hicks** are irregular painless contractions, and the **show** is blood-stained mucus from the cervix.","قبل الولادة الست ممكن تحس بـ quickening وده أول حركة للجنين. والـ lightening إن راس الجنين تنزل في الحوض. والـ Braxton Hicks انقباضات مش منتظمة ومش وجع. والـ show مخاط فيه دم بينزل من عنق الرحم.",[],"These signs help her tell false labor from true labor.","العلامات دي بتساعدها تفرّق بين الولادة الكدابة والحقيقية.",T2C[4]],
[T2G[5],"**Labor** is regular contractions that change the cervix. **Effacement** is thinning of the cervix, in percent. **Dilation** is its opening, from 0 to 10 cm. **Crowning** is when the head stays visible at the vulva, and **molding** is the overlap of the skull bones.","أثناء الولادة. الـ labor انقباضات منتظمة بتغيّر عنق الرحم. الـ effacement ترقّق عنق الرحم وبنقيسه بالنسبة المئوية. والـ dilation فتحه من صفر لـ 10 سم. والـ crowning لما الراس تفضل ظاهرة عند الـ vulva حتى بين الانقباضات، والـ molding تراكب عظام الجمجمة.",[],"Effacement and dilation are the two findings you record at every vaginal examination.","الـ effacement والـ dilation هما الاتنين اللي بنسجّلهم في كل فحص مهبلي.",T2C[5]],
[T2G[6],"A **neonate** is a baby in the first 28 days. The **puerperium** is about 6 weeks after birth. **Lochia** goes from rubra to serosa to alba, **involution** returns the uterus to normal, **afterpains** are cramps as it contracts, and **colostrum** is the first milk.","بعد الولادة. الـ neonate هو المولود في أول 28 يوم. والـ puerperium حوالي 6 أسابيع بعد الولادة. الـ lochia بتتغير من rubra لـ serosa لـ alba، والـ involution رجوع الرحم لحجمه الطبيعي، والـ afterpains تقلصات بتحصل وهو بيتقلص، والـ colostrum أول لبن.",[],"Knowing the normal recovery terms lets you spot what is abnormal.","لما نعرف الطبيعي نقدر نكتشف أي حاجة مش طبيعية.",T2C[6]]],

DATA[5]={lesson:{en:"Magnesium sulphate (MgSO4) is the first-line drug for severe pre-eclampsia and eclampsia. It also stops seizures, is used as a tocolytic in preterm labor and may protect a preterm baby from cerebral palsy. Before starting, check that the respiratory rate is 16 or more, the deep tendon reflex is normal and the urine output is at least 30 mL/h. Give a loading dose of 4 to 6 g over 15 to 20 minutes, then 2 g/h as a continuous IV infusion. Watch for toxicity (respiratory rate under 12, urine under 100 mL in 4 h, absent patellar reflex, further seizures); if it happens, stop the drug, give plain IV fluids and report the doctor.",
ar:"الـ MgSO4 (كبريتات المغنيسيوم) هو الدوا الأساسي لـ severe pre-eclampsia وeclampsia. وبيمنع التشنجات، وبنستخدمه كـ tocolytic في الولادة المبكرة، وممكن يحمي الجنين المبكر من cerebral palsy. قبل ما نبدأ، لازم التنفس يكون 16 أو أكتر، والـ DTR طبيعي، والبول 30 مل/ساعة على الأقل. الجرعة الأولى 4 لـ 6 جم على 15 لـ 20 دقيقة، وبعدين 2 جم/ساعة تسريب مستمر. راقب التسمم (التنفس أقل من 12، بول أقل من 100 مل في 4 ساعات، patellar غايب، أو تشنج جديد)؛ لو حصل، وقّف الدوا واديها IV fluids عادي وبلّغ الدكتور."},
must:[["MgSO4 is the drug of choice for **severe pre-eclampsia** and **eclampsia**.","Also used for **preterm labor** (tocolytic) and to **prevent cerebral palsy** in preterm babies (neuroprotective).","**Before starting**: respiratory rate **16/min or more**, DTR **normal**, urine output **at least 30 mL/h**.","**Loading dose** 4–6 g over **15–20 min**, then **maintenance** 2 g/h as a continuous IV infusion.","Give **half the dose** if urine output is under **100 mL in 4 h**.","Toxicity: RR **under 12**, urine **under 100 mL in 4 h** (30 mL/h), **absent patellar reflex**, further seizures.","Antidote: **calcium gluconate** or **calcium chloride**. Nursing action: **stop the drug**, plain IV fluids, report, ECG, ventilation ready.","Continue during labor and for **at least 24 hours postpartum**."],
["الـ MgSO4 هو الدوا المختار لـ **severe pre-eclampsia** وـ **eclampsia**.","وبيتستخدم كمان في **الولادة المبكرة** (tocolytic) وعشان **يمنع cerebral palsy** للأطفال المبكرين (neuroprotective).","**قبل البدء**: التنفس **16 في الدقيقة أو أكتر**، والـ DTR **طبيعي**، والبول **30 مل/ساعة على الأقل**.","**الجرعة الأولى** 4–6 جم على **15–20 دقيقة**، وبعدين **الصيانة** 2 جم/ساعة تسريب مستمر.","اديها **نص الجرعة** لو البول أقل من **100 مل في 4 ساعات**.","التسمم: التنفس أقل من **12**، بول أقل من **100 مل في 4 ساعات** (30 مل/ساعة)، **patellar غايب**، أو تشنج تاني.","الترياق: **calcium gluconate** أو **calcium chloride**. التصرف: **وقّف الدوا**، IV fluids عادي، بلّغ الدكتور، ECG، والتنفس الصناعي جاهز.","كمّل أثناء الولادة ولمدة **24 ساعة على الأقل بعد الولادة**."]],
facts:[{en:"Indications",ar:"الاستخدامات",l:["Severe pre-eclampsia","Eclampsia","Preterm labor (as a tocolytic agent)","Prevention of cerebral palsy in preterm babies (neuroprotective action)"]},
{en:"Contraindications",ar:"موانع الاستخدام",c:"red",l:["Impaired renal function","Myasthenia gravis (use cautiously)","Myocardial ischemia or failure"]},

tbl:[{t:{en:"Dose and start criteria",ar:"الجرعات وشروط البدء"},h:[["Item","Value"],["البند","القيمة"]],r:[["**Loading dose**","4–6 g IV over 15–20 min"],["**Maintenance**","2 g/h continuous IV infusion"],["**Respiratory rate** before start","16/min or more"],["**Urine output**","At least 30 mL/h; half dose if under 100 mL in 4 h"],["**DTR** before start","Normal"]]},

v:[["Check criteria","Before starting MgSO4, check that the respiratory rate is 16 or more, the deep tendon reflex is normal and the urine output is at least 30 mL per hour.","قبل ما نبدأ MgSO4، اتأكد إن التنفس 16 أو أكتر، والـ DTR طبيعي، والبول 30 مل في الساعة على الأقل.",["dtr_knee"],"Both the respiratory rate and the reflex protect the mother from over-dosing.","التنفس والـ reflex بيحموا الأم من الجرعة الزيادة."],
["Prepare","Prepare a 500 mL IV bag, MgSO4 ampules, an IV tray, a urinary catheter, calcium gluconate or calcium chloride as the antidote, and the intake and output chart.","جهّز كيس IV سعة 500 مل، ampules الـ MgSO4، صينية IV، قسطرة بول، calcium gluconate أو calcium chloride كترياق، وورقة الـ intake and output.",[],"Having the antidote ready saves time in an emergency.","وجود الترياق جاهز بيوفر وقت في الطوارئ."],
["Loading dose","Give the loading dose of 4 to 6 grams over 15 to 20 minutes, then the maintenance dose of 2 grams per hour as a continuous IV infusion.","اديها الجرعة الأولى من 4 لـ 6 جرام على 15 لـ 20 دقيقة، وبعدين جرعة الصيانة 2 جرام في الساعة كتسريب مستمر.",[],"Loading gives fast levels; maintenance keeps them steady.","الجرعة الأولى بتوصل للتركيز بسرعة، والصيانة بتحافظ عليه."],
["Mix & label","Aspirate the dose from the ampules and inject it into the IV solution to keep it sterile. Label the dose, route, time and rate, then assess intake and output.","اسحب الجرعة من الـ ampules واحقنها في محلول الـ IV عشان نحافظ على التعقيم. اكتب على الكيس الجرعة والطريقة والوقت والسرعة، وبعدين قيّم الـ intake والـ output.",[],"Labels prevent errors and the intake and output chart tracks urine.","الـ label بيمنع الغلط، والـ intake and output بيتابع البول."],
["Watch for toxicity","Check for respiratory rate under 12 per minute, urine under 100 mL in 4 hours (30 mL/h), an absent patellar reflex, or further seizures.","راقب لو التنفس أقل من 12 في الدقيقة، أو البول أقل من 100 مل في 4 ساعات (30 مل/ساعة)، أو الـ patellar غايب، أو تشنج تاني.",[],"These are the four warning signs of magnesium toxicity.","دي أربع علامات تحذير للتسمم بالمغنيسيوم."],
["Toxicity action","Stop the medication immediately, give plain IV fluids, report the doctor, monitor the ECG, keep resuscitation and ventilation ready, and prepare the antidote.","وقّف الدوا فورًا، واديها IV fluids عادي، بلّغ الدكتور، راقب الـ ECG، وخلّي الإنعاش والتنفس الصناعي جاهزين، وجهّز الترياق.",[],"Fast action prevents respiratory arrest.","التصرف السريع بيمنع توقف التنفس."],
["After the dose","Observe the mother's reaction, then record and report the dose, the time and any signs of toxicity.","راقب رد فعل الأم، وبعدين سجّل وبلّغ الجرعة والوقت وأي علامات تسمم.",[],"Continue MgSO4 during labor and for at least 24 hours postpartum.","كمّل MgSO4 أثناء الولادة ولمدة 24 ساعة على الأقل بعد الولادة."]],

/* MgSO4 Watch Duty - reaction game for lesson 6 */
let ls6={r:0,tot:8,xp:0,mis:0,streak:0,lives:3,cur:null,st:0,fb:"",tL:0};
let ls6tm=null,ls6Tok=0;
function ls6New(){
const safe=Math.random()<0.5;
let rr=[16,17,18,20,22][Math.floor(Math.random()*5)],urine=[30,35,40,50,65][Math.floor(Math.random()*5)],dtr=1,seiz=0;
if(!safe){const bad=["rr","urine","dtr","seiz"][Math.floor(Math.random()*4)];
if(bad==="rr")rr=[6,8,9,10,11][Math.floor(Math.random()*5)];
else if(bad==="urine")urine=[5,10,15,20,25][Math.floor(Math.random()*5)];
else if(bad==="dtr")dtr=0;
else seiz=1;}
ls6.cur={rr,urine,dtr,seiz,safe};ls6.st=0;ls6.fb="";ls6.tL=6;ls6Tick();
}
function ls6Tick(){const id=++ls6Tok;clearInterval(ls6tm);ls6tm=setInterval(()=>{if(id!==ls6Tok)return;ls6.tL--;const e=document.getElementById("ls6t"),bar=document.getElementById("ls6bar");if(e)e.textContent=ls6.tL;if(bar)bar.style.width=(ls6.tL/6*100)+"%";if(ls6.tL<=0){clearInterval(ls6tm);ls6Ans(null)}},1000)}
function ls6Reset(){ls6={r:0,tot:8,xp:0,mis:0,streak:0,lives:3,cur:null,st:0,fb:"",tL:0};clearInterval(ls6tm);ls6New();render()}
function ls6Ans(stopChoice){
if(ls6.st)return;
clearInterval(ls6tm);
const B=lang==="ar",c=ls6.cur,correctStop=!c.safe;
let ok=stopChoice===null?false:(stopChoice===correctStop);
if(ok){ls6.xp+=50+ls6.tL*5+ls6.streak*10;ls6.streak++;ls6.fb="✅ "+(B?"صح!":"Correct!")}
else{ls6.mis++;ls6.lives=Math.max(0,ls6.lives-1);ls6.streak=0;ls6.fb="❌ "+(B?"غلط. ":"Wrong. ")+(correctStop?(B?"لازم توقف الدوا فورًا وتبلّغ.":"You should stop the drug at once and report."):(B?"القيم دي طبيعية، كمّل الجرعة وراقب.":"These values are normal, continue the dose and observe."))}
ls6.st=1;render();
}
function ls6Next(){
ls6.r++;
if(ls6.r>=ls6.tot||ls6.lives<=0){clearInterval(ls6tm);const st=ls6.mis<=1?3:ls6.mis<=3?2:1;(pg[cur]=pg[cur]||{}).vr=st;save();render();return}
ls6New();render();
}
function ls6View(){const B=lang==="ar";
if(!ls6.cur)ls6New();
if(ls6.r>=ls6.tot||ls6.lives<=0){const st=ls6.mis<=1?3:ls6.mis<=3?2:1;return `<div class="vr"><div class="vres"><div class="term" style="font-size:2rem">🏆 ${B?"خلّصت المناوبة!":"Watch duty complete!"}</div><div style="font-size:2.4rem">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><p>XP <b>${ls6.xp}</b> · ${B?"أخطاء":"Mistakes"} <b>${ls6.mis}</b></p><div class="ctl" style="justify-content:center"><button class="btn" onclick="ls6Reset()">↻ ${B?"إعادة":"Replay"}</button></div></div></div>`}
const c=ls6.cur;
const vitals=`<div class="stat"><div><span>RR</span><strong>${c.rr}/min</strong></div><div><span>${B?"البول":"Urine"}</span><strong>${c.urine} mL/h</strong></div><div><span>DTR</span><strong>${c.dtr?(B?"طبيعي":"Normal"):(B?"غايب":"Absent")}</strong></div><div><span>${B?"تشنج":"Seizure"}</span><strong>${c.seiz?(B?"حصل":"Yes"):(B?"لا":"No")}</strong></div></div>`;
const head=`<div class="vh"><div><b>🥽 ${t("vr")} · ${B?"مناوبة مراقبة MgSO4":"MgSO4 Watch Duty"}</b><div class="note" style="color:#bcd">${B?"جولة":"Round"} ${ls6.r+1}/${ls6.tot} · ${"❤️".repeat(ls6.lives)}${"🤍".repeat(3-ls6.lives)} · ${B?"سلسلة":"streak"} ${ls6.streak}</div></div><div class="vxp">⭐ ${ls6.xp} XP</div></div>`;
let body;
if(!ls6.st)body=`<div class="vd">${vitals}<div class="prog" style="margin-top:8px"><i id="ls6bar" style="width:${ls6.tL/6*100}%"></i></div><p class="note" style="text-align:center">⏱ <span id="ls6t">${ls6.tL}</span>s</p><div class="ctl" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn" onclick="ls6Ans(false)">✅ ${B?"كمّل الجرعة":"Continue dose"}</button><button class="btn alt" style="color:#fff;border-color:#ff7a9c" onclick="ls6Ans(true)">🛑 ${B?"وقّف وبلّغ":"Stop & report"}</button></div></div>`;
else body=`<div class="vd">${vitals}<p style="margin-top:8px">${ls6.fb}</p><button class="btn" onclick="ls6Next()">${t("next")} →</button></div>`;
return `<div class="vr">${head}${body}</div>`}

let lang="en",cur=0,tab="lesson",qi=0,score=0,answered=false,vi=0,history=[];
const $=s=>document.querySelector(s),t=k=>UI[lang][k],pick=(a)=>lang==="ar"?a[1]:a[0];
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";$("#bEN").classList.toggle("on",l==="en");$("#bAR").classList.toggle("on",l==="ar");$("#ttl").innerHTML=t("title")+"<small>"+t("src")+"</small>";speechSynthesis.cancel();nav();render()}
function nav(){$("#nav").innerHTML=`<button class="ch ${cur===-1?"on":""}" onclick="go(-1)"><b>🧮</b><span>${t("calc")}</span></button>`+`<button class="ch ${cur===-2?"on":""}" onclick="go(-2)"><b>📝</b><span>${t("sheet")}</span></button><button class="ch ${cur===-3?"on":""}" onclick="go(-3)"><b>🏦</b><span>${t("bank")}</span></button>`+CH.map((c,i)=>`<button class="ch ${i===cur?"on":""}" onclick="go(${i})"><b>${i+1}</b><span>${pick(c)}</span><i>${pct(i)===100?"✅ ":""}${t("pg")} ${c[2]}</i></button>`).join("")}
function go(i){cur=i;tab="lesson";qi=0;score=0;answered=false;vi=0;history=[];vStop();clearInterval(ls6tm);nav();render()}
function setTab(x){tab=x;if(x!=="video"||vs==="play")vStop();if(x!=="vr")clearInterval(ls6tm);render()}
function render(){
 if(cur===-3){$("#view").innerHTML=bankView();return}
 if(cur===-2){$("#view").innerHTML=sheetView();return}
 if(cur===-1){$("#view").innerHTML=calcView();calc();return}
 const c=CH[cur],d=DATA[cur],tabs=["lesson","quiz","video","vr","info","ask"];
 let h=`<h2>${pick(c)}</h2><p class="sub">${t("pg")} ${c[2]}</p>${pbar()}<div class="tabs">${tabs.map(tabBtn).join("")}</div>`;
 if(tab==="lesson"){h+=d?lessonView(d):`<p class="note">${t("soon")}</p>`}
 if(tab==="quiz"){h+=d?quiz(d):`<p class="note">${t("soon")}</p>`}
 if(tab==="video"){h+=d?video(d):`<p class="note">${t("soon")}</p>`}
 if(tab==="vr"){h+=cur===2?vrView():cur===3?epView():cur===4?rxView():cur===5?ls6View():cur===0?abView():cur===1?tmView():`<p class="note">${t("soon")}</p>`}
 if(tab==="info"){h+=infoView()}
 if(tab==="ask"){h+=`<div class="chat" id="chat">${history.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join("")}</div><p class="note">${lang==="ar"?"⚠️ الرد من الذكاء الاصطناعي؛ راجع المعلومة المهمة مع الكتاب أو الدكتورة.":"⚠️ AI-generated; verify key facts with the textbook or your instructor."}</p><div class="ask"><input id="q" placeholder="${t("ph")}" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">${t("send")}</button></div>`}
 $("#view").innerHTML=h;vstat();if(tab==="vr"&&cur===2)vrInit()}
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function quiz(d){
 if(qi>=d.q.length)return `<h3>${t("why")}: ${score}/${d.q.length}</h3><button class="btn" onclick="qi=0;score=0;answered=false;render()">${t("again")}</button>`;
 const q=d.q[qi],o=lang==="ar"&&q[3]?q[3]:q[2];
 return `<p><b>${qi+1}/${d.q.length}</b> ${lang==="ar"?q[1]:q[0]}</p>`+o.map((x,i)=>`<button class="opt" onclick="pickOpt(${i})">${x}</button>`).join("")+`<div id="fb"></div>`}
function pickOpt(i){
 if(answered)return;answered=true;const q=DATA[cur].q[qi];
 document.querySelectorAll(".opt").forEach((b,j)=>{if(j===q[4])b.classList.add("ok");else if(j===i)b.classList.add("bad")});
 if(i===q[4])score++;
 $("#fb").innerHTML=`<button class="btn" onclick="qi++;answered=false;qDone();render()">${t("next")}</button>`}
function vStep(n){const m=DATA[cur].v.length;vi=Math.max(0,Math.min(m-1,vi+n));speechSynthesis.cancel();render()}
function speak(){const d=DATA[cur],s=d.v[vi];say(lang==="ar"?s[2]:s[1],()=>{if(vi<d.v.length-1){vi++;render();speak()}})}
async function send(){
 const inp=$("#q"),text=inp.value.trim();if(!text)return;
 history.push({r:"u",c:text});history.push({r:"a",c:t("think")});render();
 let ans;
 try{
  const sample=await claude.use("sample");
  if(!sample){ans=t("aiOff")}else{
   const c=CH[cur],d=DATA[cur];
   const sys="You are a nursing-education tutor for Technical Institute of Nursing students, based on the textbook 'Clinical Obstetric and Gynecological Nursing 2025/2026'. Current chapter: "+c[0]+" (book page "+c[2]+"). Understand questions in Modern Standard Arabic, Egyptian colloquial Arabic, or English, and answer in the language the student used. In Arabic, use a friendly Egyptian style and keep medical terms in English. Be accurate and concise, use nursing rationale, and say when something is outside the book or needs a clinical instructor. "+(d?"Chapter notes: "+d.lesson.en:"");
   const turns=history.slice(0,-1).map(m=>({role:m.r==="u"?"user":"assistant",content:m.c}));
   const r=await sample([{role:"user",content:sys+"\n\nConversation follows."},{role:"assistant",content:"Understood."},...turns],{cache:false,modelTier:"complex"});
   ans=r.text}
 }catch(e){ans=t("aiOff")}
 history[history.length-1]={r:"a",c:ans};render();
 const ch=$("#chat");if(ch)ch.scrollTop=ch.scrollHeight}
$("#bEN").onclick=()=>setLang("en");$("#bAR").onclick=()=>setLang("ar");
setLang("en");
</script>
